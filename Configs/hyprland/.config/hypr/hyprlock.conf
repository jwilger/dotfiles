label {
  color=rgba(242, 243, 244, 0.75)
  font_family=JetBrainsMono Nerd Font Extrabold
  font_size=95
  halign=center
  position=0, 200
  text=cmd[update:1000] echo "$(date +"%-I:%M")"

  valign=center
}
